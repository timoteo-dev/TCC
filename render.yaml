services:
  - type: web
    name: api-merenda-facial
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python download_model.py
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: FIREBASE_SERVICE_ACCOUNT
        sync: false
      - key: PYTHON_VERSION
        value: 3.11.9
